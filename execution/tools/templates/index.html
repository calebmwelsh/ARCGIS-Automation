<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">ArcGIS Data Explorer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'></path><polyline points='9 22 9 12 15 12 15 22'></polyline></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Palette: Deep Slate / Green Tint for ArcGIS */
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #064e3b 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #10b981;
            /* Emerald 500 */
            --accent-hover: #059669;
            /* Emerald 600 */
            --accent-glow: rgba(16, 185, 129, 0.4);
            --success: #10b981;
            --warning: #f59e0b;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(148, 163, 184, 0.2);
            --input-focus: #10b981;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s ease-out;
            margin-top: 40px;
            margin-bottom: 40px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            color: var(--text-main);
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 400;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .full-width {
            grid-column: span 2;
        }

        .section-title {
            grid-column: span 2;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
            margin-top: 16px;
            margin-bottom: -8px;
        }

        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width,
            .section-title {
                grid-column: span 1;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s ease;
            appearance: none;
        }

        select {
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }

        select option {
            background-color: #1e293b;
            color: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
            background-color: rgba(30, 41, 59, 0.9);
        }

        input::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        .actions {
            display: flex;
            gap: 16px;
            margin-top: 40px;
            justify-content: flex-end;
            padding-top: 20px;
            border-top: 1px solid var(--card-border);
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--input-border);
        }

        .btn-secondary:hover {
            color: var(--text-main);
            border-color: var(--text-secondary);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .btn-run {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-run:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        #status-area {
            margin-top: 24px;
            padding: 16px;
            border-radius: 12px;
            background-color: rgba(15, 23, 42, 0.5);
            display: none;
            border-left: 4px solid;
            font-size: 14px;
            line-height: 1.5;
            transition: all 0.3s ease;
        }

        .status-running {
            border-color: var(--warning);
            color: #fbbf24;
            background-color: rgba(245, 158, 11, 0.1) !important;
        }

        .status-completed {
            border-color: var(--success);
            color: #34d399;
            background-color: rgba(16, 185, 129, 0.1) !important;
        }

        .status-icon {
            margin-right: 8px;
            display: inline-block;
        }

        .log-box {
            margin-top: 24px;
            background-color: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            display: none;
        }

        .log-header {
            padding: 12px 16px;
            background-color: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .clear-logs {
            cursor: pointer;
            color: var(--accent-primary);
        }

        .clear-logs:hover {
            text-decoration: underline;
        }

        .log-content {
            padding: 16px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            color: #e2e8f0;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.5;
        }

        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            margin-top: 4px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
            backdrop-filter: blur(8px);
        }

        .autocomplete-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .autocomplete-item:hover {
            background: rgba(16, 185, 129, 0.1);
        }

        .ac-badge {
            font-size: 10px;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 12px;
            font-weight: 600;
        }
        .ac-badge.zip { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
        .ac-badge.city { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
        .ac-badge.county { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }

        #results-container {
            display: none;
            margin-top: 32px;
        }

        .table-responsive {
            overflow-x: auto;
            background: rgba(15, 23, 42, 0.3);
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 600px;
        }

        th {
            padding: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--card-border);
            white-space: nowrap;
        }

        td {
            padding: 12px;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            vertical-align: top;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .code-cell {
            font-family: 'Consolas', monospace;
            color: #93c5fd;
            word-break: break-all;
            max-width: 250px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: var(--card-bg);
            margin: 10% auto;
            padding: 24px;
            border: 1px solid var(--card-border);
            border-radius: 16px;
            width: 80%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            color: var(--text-main);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .close-modal {
            color: var(--text-secondary);
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-modal:hover {
            color: var(--text-main);
        }

        .sort-option-btn {
            width: 100%;
            text-align: left;
            padding: 12px 16px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid transparent;
            border-radius: 8px;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
        }

        .sort-option-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-primary);
        }

        .sort-option-btn.active {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--accent-primary);
            color: #10b981;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1 id="main-header">ArcGIS Data Explorer</h1>
            <div id="main-subtitle" class="subtitle">Configure Feature Service filters and fetch mapping data</div>
        </header>

        <div class="form-grid">
            <input type="hidden" id="fUrl" value="">

            <!-- User Friendly Search Filters -->
            <div class="section-title">Property Location</div>

            <div class="form-group full-width" style="position: relative;">
                <label for="locationSearch">Search by Location</label>
                <input type="text" id="locationSearch" placeholder="Enter a Zip Code, City, or County (e.g. Noblesville) ..." autocomplete="off">
                <div id="autocompleteResults" class="autocomplete-dropdown"></div>
                <input type="hidden" id="searchScopeType" value="zip">
                <input type="hidden" id="searchScopeValue" value="">
                <p id="locationSelectionText" style="font-size: 13px; color: var(--accent-primary); margin-top: 8px; display: none;">Targeting: <strong id="locationSelectionName" style="color: white; margin-left: 4px;"></strong></p>
            </div>

            <div class="form-group full-width" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label for="yearCondition">Year Built Is</label>
                    <select id="yearCondition" onchange="toggleYearInputs()">
                        <option value="any">Any Year (Ignore)</option>
                        <option value="exactly">Exactly</option>
                        <option value="before">Before</option>
                        <option value="after">After</option>
                        <option value="between">Between</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="year1">Year</label>
                    <input type="number" id="year1" placeholder="YYYY" min="1800" max="2030" disabled>
                </div>

                <div class="form-group" id="year2Group" style="opacity: 0.5;">
                    <label for="year2">And Year</label>
                    <input type="number" id="year2" placeholder="YYYY" min="1800" max="2030" disabled>
                </div>
            </div>

            <input type="hidden" id="whereClause" value="1=1">


            <div class="section-title">Data Output Options</div>

            <div class="form-group full-width" style="margin-bottom: 8px;">
                <label>Fields to Extract</label>
                <div
                    style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 8px;">
                    <label
                        style="display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none; color: var(--text-main); font-weight: 500;">
                        <input type="checkbox" class="out-field-cb" value="OBJECTID" checked disabled
                            style="width: 16px; height: 16px;">
                        OBJECTID (Required)
                    </label>
                    <label
                        style="display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none; color: var(--accent-primary); font-weight: 500;">
                        <input type="checkbox" class="out-field-cb" value="*" style="width: 16px; height: 16px;"
                            onchange="toggleAllFields(this.checked)">
                        All Fields (*)
                    </label>
                    <label
                        style="display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none; color: var(--text-main); font-weight: 400;">
                        <input type="checkbox" class="out-field-cb" value="LOCADDRESS"
                            style="width: 16px; height: 16px;">
                        Address
                    </label>
                    <label
                        style="display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none; color: var(--text-main); font-weight: 400;">
                        <input type="checkbox" class="out-field-cb" value="LOCCITY" style="width: 16px; height: 16px;">
                        City
                    </label>
                    <label
                        style="display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none; color: var(--text-main); font-weight: 400;">
                        <input type="checkbox" class="out-field-cb" value="LOCZIP" style="width: 16px; height: 16px;">
                        Zip Code
                    </label>
                    <label
                        style="display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none; color: var(--text-main); font-weight: 400;">
                        <input type="checkbox" class="out-field-cb" value="DEEDEDOWNR"
                            style="width: 16px; height: 16px;">
                        Owner Name
                    </label>
                    <label
                        style="display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none; color: var(--text-main); font-weight: 400;">
                        <input type="checkbox" class="out-field-cb" value="DEEDACRES"
                            style="width: 16px; height: 16px;">
                        Parcel Acres
                    </label>
                    <label
                        style="display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none; color: var(--text-main); font-weight: 400;">
                        <input type="checkbox" class="out-field-cb" value="year_built"
                            style="width: 16px; height: 16px;">
                        Year Built
                    </label>
                    <label
                        style="display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none; color: var(--text-main); font-weight: 400;">
                        <input type="checkbox" class="out-field-cb" value="sq_ft_res"
                            style="width: 16px; height: 16px;">
                        Residential Sq Ft
                    </label>
                    <label
                        style="display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none; color: var(--text-main); font-weight: 400;">
                        <input type="checkbox" class="out-field-cb" value="AVTOTGROSS"
                            style="width: 16px; height: 16px;">
                        Total Assessed Value
                    </label>
                </div>
            </div>

            <div class="section-title">Pagination & Limits</div>

            <div class="form-group">
                <label for="recordCount">Result Record Count</label>
                <input type="number" id="recordCount" placeholder="200">
            </div>



        </div>

        <div class="actions">
            <!-- Debug logs hidden as requested but functionality preserved -->
            <button class="btn-secondary" onclick="toggleLogs()" style="margin-right: auto; display: none;">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                </svg>
                Debug Logs
            </button>
            <button class="btn-secondary" onclick="saveConfig()" id="btn-save">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4">
                    </path>
                </svg>
                Save Env Variables
            </button>
            <span id="save-indicator"
                style="color: var(--accent-primary); font-size: 13px; font-weight: 500; display: none; margin-left: 8px;">Saved!</span>

            <button class="btn-run" onclick="runFetch()" id="btn-fetch">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                Search
            </button>
        </div>

        <div id="status-area">
            <span id="status-icon" class="status-icon"></span>
            <span id="status-text">Idle</span>
        </div>

        <div id="log-container" class="log-box" style="display: none;">
            <div class="log-header">
                <span>Terminal Output</span>
                <span class="clear-logs" onclick="document.getElementById('logs-content').innerHTML = ''">Clear</span>
            </div>
            <div id="logs-content" class="log-content"></div>
        </div>

        <div id="results-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2 style="font-size: 20px; font-weight: 600; margin: 0; color: var(--text-main);">Extraction Results
                    <span id="results-count"
                        style="color: var(--text-secondary); font-size: 16px; font-weight: 400; margin-left: 8px;">(0)</span>
                </h2>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-secondary" onclick="openSortModal()"
                        style="padding: 8px 16px; font-size: 13px;">
                        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right: 4px;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path>
                        </svg>
                        Sort By
                    </button>
                    <button class="btn-secondary" onclick="exportCSV()"
                        style="padding: 8px 16px; font-size: 13px; background-color: rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.5); color: #60a5fa;">
                        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right: 4px;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg>
                        Download Data
                    </button>
                    <button class="btn-secondary" onclick="loadResults()"
                        style="padding: 8px 16px; font-size: 13px;">Refresh Table</button>
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 80px;">Object ID</th>
                            <th>Address / Location</th>
                            <th>Google Maps</th>
                            <th>Map Link</th>
                            <th>Features (JSON)</th>
                        </tr>
                    </thead>
                    <tbody id="results-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Sort Modal -->
    <div id="sortModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Sort Results</h2>
                <span class="close-modal" onclick="closeSortModal()">&times;</span>
            </div>
            <div id="sort-options-container">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', loadConfig);

        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                const data = await response.json();
                const env = data.current_env;

                document.getElementById('fUrl').value = env.ARCGIS_FEATURE_SERVICE_URL || '';
                document.getElementById('recordCount').value = env.RESULT_RECORD_COUNT || '200';

                // Load semantic filters
                document.getElementById('searchScopeType').value = env.SEARCH_SCOPE_TYPE || 'zip';
                
                const scopeVal = env.SEARCH_SCOPE_VALUE || env.ZIP_CODE || '';
                document.getElementById('searchScopeValue').value = scopeVal;
                
                if (scopeVal) {
                    document.getElementById('locationSelectionText').style.display = 'block';
                    document.getElementById('locationSelectionName').innerText = `${env.SEARCH_SCOPE_TYPE || 'zip'}: ${scopeVal}`;
                }

                document.getElementById('yearCondition').value = env.YEAR_BUILT_CONDITION || 'any';
                document.getElementById('year1').value = env.YEAR_BUILD_1 || '';
                document.getElementById('year2').value = env.YEAR_BUILD_2 || '';

                // Parse Out Fields into checkboxes
                const outFieldsStr = env.DATA_OUTPUT_OPTIONS || '*';
                const selectedFields = outFieldsStr.split(',').map(s => s.trim());
                document.querySelectorAll('.out-field-cb').forEach(cb => {
                    if (cb.value === 'OBJECTID') return;

                        cb.checked = true;

                    }

        function toggleAllFields(isChecked) {

        function toggleAdvancedWhere(e) {
            e.preventDefault();
            const input = document.getElementById('whereClause');
            if (input.readOnly) {
                input.readOnly = false;
                input.style.backgroundColor = 'var(--input-bg)';

        function toggleYearInputs() {
            const condition = document.getElementById('yearCondition').value;
            const y1 = document.getElementById('year1');
            const y2 = document.getElementById('year2');
            const y2Group = document.getElementById('year2Group');

            y1.disabled = condition === 'any';

            if (condition === 'between') {
                y2.disabled = false;
                y2Group.style.opacity = '1';
            } else {
                y2.disabled = true;
                y2Group.style.opacity = '0.5';
                y2.value = '';
            }
            
            if (condition === 'any') {
                y1.value = '';
                y2.value = '';
            }
            updateWherePreview();
        }

        function updateWherePreview() {
            // Do not auto-update if manual override is engaged
            if (!document.getElementById('whereClause').readOnly) return;

            const scopeType = document.getElementById('searchScopeType').value;
            const scopeValue = document.getElementById('searchScopeValue').value;
            const condition = document.getElementById('yearCondition').value;
            const y1 = document.getElementById('year1').value;
            const y2 = document.getElementById('year2').value;

            let clauses = [];

            if (scopeValue) {
                if (scopeType === 'zip') {
                    clauses.push(`LOCZIP = '${scopeValue}'`);
                } else if (scopeType === 'city') {
                    const city = scopeValue.split('|')[0].toUpperCase();
                    clauses.push(`UPPER(LOCCITY) = '${city}'`);
                } else if (scopeType === 'county') {
                    clauses.push(`[County Filter via geo_index active]`);
                }
            }

            if (condition !== 'any' && y1) {
                if (condition === 'exactly') clauses.push(`year_built = ${y1}`);
                if (condition === 'after') clauses.push(`year_built > ${y1}`);
                if (condition === 'before') clauses.push(`year_built < ${y1}`);
                if (condition === 'between' && y2) {
                    // ArcGIS SQL Between is inclusive
                    const min = Math.min(y1, y2);
                    const max = Math.max(y1, y2);
                    clauses.push(`year_built BETWEEN ${min} AND ${max}`);
                }
            }

            const finalWhere = clauses.length > 0 ? clauses.join(' AND ') : '1=1';
            document.getElementById('whereClause').value = finalWhere;
        }

        // Add event listeners for dynamic preview
        document.getElementById('year1').addEventListener('input', updateWherePreview);
        document.getElementById('year2').addEventListener('input', updateWherePreview);

        // Autocomplete JS logic
        let debounceTimer;

        document.getElementById('locationSearch').addEventListener('input', function(e) {
            clearTimeout(debounceTimer);
            
            // Clear the selected scope when user starts typing something new
            document.getElementById('searchScopeValue').value = '';
            document.getElementById('locationSelectionText').style.display = 'none';
            updateWherePreview();
            
            const query = e.target.value.trim();
            const dropdown = document.getElementById('autocompleteResults');
            
            if (query.length < 2) {
                dropdown.style.display = 'none';
                return;
            }
            
            debounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`/api/geo/search?q=${encodeURIComponent(query)}`);
                    if (!res.ok) {
                        console.error("Endpoint not found. Did you restart ui_server.py?");
                        return;
                    }
                    const data = await res.json();
                    
                    if (data.results && data.results.length > 0) {
                        dropdown.innerHTML = '';
                        data.results.forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'autocomplete-item';
                            div.innerHTML = `<span class="ac-badge ${item.type}">${item.type}</span><span>${item.label}</span>`;
                            div.onclick = () => selectLocation(item);
                            dropdown.appendChild(div);
                        });
                        dropdown.style.display = 'block';
                    } else {
                        dropdown.innerHTML = '<div style="padding: 12px 16px; color: var(--text-secondary); font-size: 13px;">No matching Zip, City, or County found.</div>';
                        dropdown.style.display = 'block';
                    }
                } catch(err) {
                    console.error("Autocomplete error:", err);
                }
            }, 300);
        });

        function selectLocation(item) {
            document.getElementById('searchScopeType').value = item.type;
            document.getElementById('searchScopeValue').value = item.value;
            
            document.getElementById('locationSearch').value = item.label;
            document.getElementById('autocompleteResults').style.display = 'none';

        // Hide dropdown on click outside
        document.addEventListener('click', function(e) {

        });

        async function saveConfig(silent = false) {
            const scopeType = document.getElementById('searchScopeType').value;
            const scopeValue = document.getElementById('searchScopeValue').value;

            if (!scopeValue) {
                if (!silent) alert("Please search for and select a valid Zip Code, City, or County from the dropdown list first.");
                return false;
            }

            updateWherePreview(); // Ensure latest state before save

            let selectedOutFields = [];
            document.querySelectorAll('.out-field-cb:checked').forEach(cb => {
                selectedOutFields.push(cb.value);
            });
            let outFieldsString = selectedOutFields.includes('*') ? '*' : selectedOutFields.join(', ');

            const payload = {
                ARCGIS_FEATURE_SERVICE_URL: document.getElementById('fUrl').value,
                SEARCH_SCOPE_TYPE: scopeType,
                SEARCH_SCOPE_VALUE: scopeValue,
                ZIP_CODE: scopeType === 'zip' ? scopeValue : '',
                YEAR_BUILT_CONDITION: document.getElementById('yearCondition').value,
                YEAR_BUILD_1: document.getElementById('year1').value,
                YEAR_BUILD_2: document.getElementById('year2').value,
                DATA_OUTPUT_OPTIONS: outFieldsString,
                RESULT_RECORD_COUNT: document.getElementById('recordCount').value || "200"
            };

            try {
                const res = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error("Failed to save");

                if (!silent) {
                    const indicator = document.getElementById('save-indicator');
                    indicator.style.display = 'inline';
                    setTimeout(() => {
                        indicator.style.display = 'none';
                    }, 2000);
                }
                return true;
            } catch (err) {
                console.error(err);
                if (!silent) alert("Error saving configuration!");
                return false;
            }
        }

        async function runFetch() {
            await saveConfig(true);
            const btn = document.getElementById('btn-fetch');
            btn.disabled = true;

            try {
                const res = await fetch('/api/run', {
                    method: 'POST'
                });

                if (res.status === 409) {
                    alert("A process is already running.");
                    return;
                }

                pollStatus();
                pollLogs();
            } catch (err) {
                alert("Failed to start fetch.");
                console.error(err);
            }
        }

        let statusInterval;
        let logInterval;

        function pollStatus() {
            clearInterval(statusInterval);
            updateStatusUI('running');

            statusInterval = setInterval(async () => {
                try {
                    const res = await fetch('/api/status');
                    const data = await res.json();

                    if (data.status !== 'running') {
                        clearInterval(statusInterval);
                        clearInterval(logInterval);
                        setTimeout(pollLogsContent, 500); // one last log pull
                        updateStatusUI(data.status);
                        document.getElementById('btn-fetch').disabled = false;
                        loadResults(); // Auto load results when done
                    }
                } catch (e) {
                    clearInterval(statusInterval);
                    updateStatusUI('error');
                    document.getElementById('btn-fetch').disabled = false;
                }
            }, 1000);
        }

        function pollLogs() {
            clearInterval(logInterval);
            logInterval = setInterval(pollLogsContent, 1000);
        }

        async function pollLogsContent() {
            try {
                const res = await fetch('/api/logs');
                const data = await res.json();
                const container = document.getElementById('logs-content');

                // Only update if changed
                if (data.logs.join('\n') !== container.textContent) {
                    container.textContent = data.logs.join('\n');
                    container.scrollTop = container.scrollHeight;
                }
            } catch (e) {
                console.error("Log fetch failed", e);
            }
        }

        function toggleLogs() {
            const el = document.getElementById('log-container');
            el.style.display = el.style.display === 'none' ? 'block' : 'none';
        }

        function updateStatusUI(status) {
            const area = document.getElementById('status-area');
            const icon = document.getElementById('status-icon');
            const text = document.getElementById('status-text');

            area.style.display = 'block';
            area.className = '';

            if (status === 'running') {
                area.classList.add('status-running');
                icon.innerHTML = '⏳';
                text.textContent = 'Extraction script is running... check logs below.';
            } else if (status === 'completed') {
                area.classList.add('status-completed');
                icon.innerHTML = '✅';
                text.textContent = 'Extraction completed successfully.';
            } else {
                area.classList.add('status-running');
                area.style.borderColor = 'var(--text-secondary)';
                icon.innerHTML = 'ℹ️';
                text.textContent = `Status: ${status}`;
            }
        }

        let currentFeatures = [];
        let currentSortField = null;
        let currentSortDir = 'asc';

        async function loadResults() {
            try {
                const res = await fetch('/api/results');
                const data = await res.json();
                currentFeatures = data.features || [];
                renderResults();
            } catch (e) {
                console.error("Failed to load results:", e);
                document.getElementById('results-body').innerHTML = '<tr><td colspan="5" style="text-align:center; color: #ef4444;">Failed to load results.</td></tr>';
            }
        }

        function renderResults() {
            const features = currentFeatures;
            document.getElementById('results-container').style.display = 'block';
            document.getElementById('results-count').textContent = `(${features.length})`;

            const tbody = document.getElementById('results-body');
            tbody.innerHTML = '';

            if (features.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No results found or file not ready</td></tr>';
                return;
            }

            // Apply Sort
            let displayFeatures = [...features];
            if (currentSortField) {
                displayFeatures.sort((a, b) => {
                    let valA = a.attributes[currentSortField];
                    let valB = b.attributes[currentSortField];
                    
                    // Handle nulls
                    if (valA === null || valA === undefined) return currentSortDir === 'asc' ? 1 : -1;
                    if (valB === null || valB === undefined) return currentSortDir === 'asc' ? -1 : 1;
                    
                    if (typeof valA === 'string' && typeof valB === 'string') {
                        return currentSortDir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                    } else if (typeof valA === 'number' && typeof valB === 'number') {
                        return currentSortDir === 'asc' ? valA - valB : valB - valA;
                    }
                    return 0; // Fallback
                });
            }

            // Show up to 100 results (or more, but keep it performant for DOM)
            displayFeatures = displayFeatures.slice(0, 100); 

            // Identify all unique attributes across the features to ensure a static layout
            const allAttributeKeys = new Set();
            displayFeatures.forEach(f => {
                if (f.attributes) {
                    Object.keys(f.attributes).forEach(k => allAttributeKeys.add(k));
                }
            });
            const sortedAttributeKeys = Array.from(allAttributeKeys).sort();

            displayFeatures.forEach(feature => {
                const attrs = feature.attributes || {};
                const objId = attrs.OBJECTID || attrs.objectid || attrs.FID || 'N/A';
                
                // Use standardized fields injected by fetch_arcgis_data.py
                const address_base = attrs.std_address || '';
                const city_base = attrs.std_city || '';
                const zip_base = attrs.std_zip || '';
                const state_abbrev = attrs.std_state || 'IN';
                const county_name = attrs.std_county || '';
                const layer_url = attrs.std_layer_url || '';
                const report_url = attrs.std_property_report_url;

                let fullAddress = address_base;
                if (city_base) fullAddress += `, ${city_base}`;
                if (state_abbrev) fullAddress += ` ${state_abbrev}`;
                if (zip_base) fullAddress += `, ${zip_base}`;

                if (!fullAddress || fullAddress === ' ') fullAddress = 'N/A';

                // Create Google Maps link (Always present and state-aware)
                let gMapsUrl = 'N/A';
                let gMapsHtml = 'N/A';
                
                if (fullAddress !== 'N/A' && address_base.length > 2) {
                    const encodedAddress = encodeURIComponent(fullAddress);
                    gMapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedAddress}`;
                    gMapsHtml = `<a href="${gMapsUrl}" target="_blank" style="color: #4285F4; text-decoration: underline; font-weight: 500;">Google Maps ↗</a>`;
                } else if (attrs.parcel_id || attrs.PIN || attrs.PARCELNUMBER) {
                    // Fallback to searching by Parcel ID if address is missing
                    const pId = attrs.parcel_id || attrs.PIN || attrs.PARCELNUMBER;
                    const searchStr = `${pId} ${county_name} ${state_abbrev}`.trim();
                    gMapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(searchStr)}`;
                    gMapsHtml = `<a href="${gMapsUrl}" target="_blank" style="color: #4285F4; text-decoration: underline; font-weight: 500;">Search Parcel ID ↗</a>`;
                }

                // Create dynamic map links
                let mapLinkHtml = '';
                const viewer_type = attrs.std_viewer_type;
                const viewer_id = attrs.std_viewer_id;

                if (report_url) {
                    // PRIORITY 1: Direct official property report URL (e.g. Beacon, BeaconSite, qPublic)
                    mapLinkHtml = `<a href="${report_url}" target="_blank" style="color: #10b981; text-decoration: underline; font-weight: 600;">Property Report ↗</a>`;
                } else if (viewer_type === 'experience' && viewer_id) {
                    // PRIORITY 2: Generalized Experience Builder link
                    const searchAddress = `${address_base}, ${city_base}, ${state_abbrev} ${zip_base}`.trim();
                    const mapLinkUrl = searchAddress.length > 10 
                        ? `https://experience.arcgis.com/experience/${viewer_id}#widget_2=text:${encodeURIComponent(searchAddress)}`
                        : `https://experience.arcgis.com/experience/${viewer_id}`;

                    mapLinkHtml = `<a href="${mapLinkUrl}" target="_blank" style="color: var(--accent-primary); text-decoration: underline;">Parcel Map ↗</a>`;
                } else if (viewer_type === 'webapp' && viewer_id) {
                    // PRIORITY 3: Generalized Web AppBuilder link
                    const mapLinkUrl = `https://www.arcgis.com/apps/webappviewer/index.html?id=${viewer_id}`;
                    mapLinkHtml = `<a href="${mapLinkUrl}" target="_blank" style="color: var(--accent-primary); text-decoration: underline;">Parcel Map ↗</a>`;
                } else if (county_name.includes('Hamilton') && state_abbrev === 'IN') {
                    // PRIORITY 4: Legacy Hamiltonian fallback (Should be handled by viewer_id in profile eventually)
                    const searchAddress = `${address_base}, ${city_base}, IN ${zip_base}`.trim();
                    const mapLinkUrl = `https://experience.arcgis.com/experience/619d96a48c8241cbad905b9e640c157f#widget_2=text:${encodeURIComponent(searchAddress)}`;
                    mapLinkHtml = `<a href="${mapLinkUrl}" target="_blank" style="color: var(--accent-primary); text-decoration: underline;">Experience Map ↗</a>`;
                } else if (layer_url) {
                    // PRIORITY 5: Generic ArcGIS Web Map Viewer fallback 
                    const viewerUrl = `https://www.arcgis.com/home/webmap/viewer.html?url=${encodeURIComponent(layer_url)}&source=sd`;
                    mapLinkHtml = `<a href="${viewerUrl}" target="_blank" style="color: var(--accent-primary); text-decoration: underline;">ArcGIS Viewer ↗</a>`;
                } else {
                    mapLinkHtml = `<span style="color: var(--text-secondary); font-size: 11px;">Use Google Maps link →</span>`;
                }

                // Filter out core display props from the json dump to save space
                const ignoreKeys = ['OBJECTID', 'LOCADDRESS', 'LOCCITY', 'LOCZIP', 'FID', 'ADDRESS', 'CITY', 'ZIP'];
                const otherAttrs = {};
                
                sortedAttributeKeys.forEach(key => {
                    if (!ignoreKeys.includes(key.toUpperCase())) {
                        let val = attrs[key];
                        // Empty values turn into N/A
                        if (val === null || val === undefined || String(val).trim() === '') {
                            otherAttrs[key] = '<span style="color:rgba(255,255,255,0.2);">N/A</span>';
                        } else {
                            otherAttrs[key] = val;
                        }
                    }
                });

                const mainTr = document.createElement('tr');
                mainTr.style.cursor = 'pointer';
                mainTr.title = 'Click to expand properties';
                mainTr.innerHTML = `
                    <td><strong>${objId}</strong></td>
                    <td>${fullAddress}</td>
                    <td>${gMapsHtml}</td>
                    <td>${mapLinkHtml}</td>
                    <td style="color: var(--text-secondary); font-size: 13px;">Click to view ${Object.keys(otherAttrs).length} attributes ▼</td>
                `;

                const detailTr = document.createElement('tr');
                detailTr.style.display = 'none';
                detailTr.style.backgroundColor = 'rgba(0,0,0,0.2)';

                let attrsHtml = '<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; padding: 16px;">';
                for (let key in otherAttrs) {
                    attrsHtml += `
                        <div>
                            <div style="color: var(--accent-primary); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">${key}</div>
                            <div style="color: var(--text-main); font-weight: 500; margin-top: 2px;">${otherAttrs[key]}</div>
                        </div>
                    `;
                }
                attrsHtml += '</div>';

                detailTr.innerHTML = `
                    <td colspan="5" style="padding: 0; border-top: none; border-bottom: 1px solid rgba(255,255,255,0.05);">
                        ${attrsHtml}
                    </td>
                `;

                mainTr.onclick = (e) => {
                    // Prevent row toggle if they click the map link exactly
                    if (e.target.tagName.toLowerCase() === 'a') return;

                    if (detailTr.style.display === 'none') {
                        detailTr.style.display = 'table-row';
                        mainTr.style.backgroundColor = 'rgba(255,255,255,0.05)';
                    } else {
                        detailTr.style.display = 'none';
                        mainTr.style.backgroundColor = '';
                    }
                };

                tbody.appendChild(mainTr);
                tbody.appendChild(detailTr);
            });
        }

        // --- SORTING MODAL LOGIC ---
        function openSortModal() {
            if (currentFeatures.length === 0) return;
            
            const modal = document.getElementById('sortModal');
            const container = document.getElementById('sort-options-container');
            container.innerHTML = '';

            const friendlyNames = {
                // Core
                'OBJECTID': 'Record ID',
                'PARCELNO': 'Parcel Number',
                'STPRCLNO': 'State Parcel Number',
                'STPRCLNO_UNFORMATTED': 'Unformatted State Parcel Number',
                'GLOBALID': 'Global ID',

                // Address & Location
                'LOCADDRESS': 'Address',
                'LOCHSENUMR': 'House Number',
                'LOCSTRDIR': 'Street Direction',
                'LOCSTRNAME': 'Street Name',
                'LOCSTRSUF': 'Street Suffix',
                'LOCCITY': 'City',
                'LOCZIP': 'Zip Code',
                
                // Ownership
                'DEEDEDOWNR': 'Owner Name',
                'OWNNAME': 'Owner Name',
                'OWNADDRESS': 'Owner Address',
                'OWNCITY': 'Owner City',
                'OWNSTATE': 'Owner State',
                'OWNZIP': 'Owner Zip Code',
                
                // Property Physical Traits
                'YEAR_BUILT': 'Year Built',
                'year_built': 'Year Built',
                'SQ_FT_RES': 'Residential Sq Ft',
                'sq_ft_res': 'Residential Sq Ft',
                'DEEDACRES': 'Parcel Acres',
                'acreage': 'Parcel Acres',
                'NUM_FLOORS': 'Number of Floors',
                'SHAPE__AREA': 'Area Size',
                'SHAPE__Length': 'Perimeter Length',
                'SHAPE__LENGTH': 'Perimeter Length',

                // Legal & Administrative
                'PROPCLASS': 'Property Class',
                'PROPUSE': 'Property Use',
                'LEGALDESC': 'Legal Description',
                'SECTIONNO': 'Section Number',
                'TOWNSHIP': 'Township',
                'POLTWP': 'Political Township',
                'RANGE': 'Range',
                'TAXDISTNAM': 'Tax District',
                'TAXDISTCOD': 'Tax District Code',
                'NEIGHBORHOOD': 'Neighborhood',
                'HOMESTEAD': 'Homestead Status',
                'HMSTD_CODE': 'Homestead Code',
                'CORPLIMIT': 'Corporate Limit',
                
                // Value & Tax
                'AVTOTGROSS': 'Total Assessed Value',
                'AVLAND': 'Assessed Land Value',
                'AVIMPROVE': 'Assessed Improvement Value',
                'AVTAXYR': 'Assessment Tax Year',
                
                // System & Misc
                'EXPORTDATE': 'Export Date',
                'LSTXFRDATE': 'Last Transfer Date',
                'CREATED_USER': 'Created User',
                'CREATED_DATE': 'Created Date',
                'LAST_EDITED_USER': 'Last Edited User',
                'LAST_EDITED_DATE': 'Last Edited Date',
                'PROPERTYREPORT': 'Property Report Link',
                'MAPID': 'Map ID',
                'LAND_HOOK': 'Land Hook',
                'LRSN': 'LRSN'
            };

            const priorityOrder = [
                'YEAR_BUILT', 'year_built',
                'AVTOTGROSS',
                'DEEDACRES',
                'SQ_FT_RES', 'sq_ft_res',
                'DEEDEDOWNR',
                'LOCADDRESS',
                'LOCCITY',
                'LOCZIP',
                'OBJECTID'
            ];
            
            // Extract all unique keys from current features
            const allKeys = new Set();
            currentFeatures.forEach(f => {
                if(f.attributes) {
                    Object.keys(f.attributes).forEach(k => allKeys.add(k));
                }
            });
            
            const keysArray = Array.from(allKeys).sort((a, b) => {
                // Check if either is in the priority list
                const idxA = priorityOrder.indexOf(a);
                const idxB = priorityOrder.indexOf(b);
                
                if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                if (idxA !== -1) return -1;
                if (idxB !== -1) return 1;
                
                // Otherwise sort alphabetically by their friendly or raw names
                const nameA = (friendlyNames[a] || a).toLowerCase();
                const nameB = (friendlyNames[b] || b).toLowerCase();
                return nameA.localeCompare(nameB);
            });
            
            keysArray.forEach(key => {
                const btn = document.createElement('button');
                btn.className = `sort-option-btn ${currentSortField === key ? 'active' : ''}`;
                
                // Determine if ascending or descending arrow should show
                let arrow = '';
                if (currentSortField === key) {
                    arrow = currentSortDir === 'asc' ? '↑ (Low-High / A-Z)' : '↓ (High-Low / Z-A)';
                }
                
                function formatUnknownKey(k) {
                    if (!k) return k;
                    return k.split('_').filter(w => w.length > 0).map(word => 
                        word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()
                    ).join(' ');
                }
                
                const displayName = friendlyNames[key] || formatUnknownKey(key);
                
                btn.innerHTML = `<span>${displayName}</span> <span style="font-size: 12px; opacity: 0.7;">${arrow}</span>`;
                
                btn.onclick = () => {
                    if (currentSortField === key) {
                        // Toggle direction
                        currentSortDir = currentSortDir === 'asc' ? 'desc' : 'asc';
                    } else {
                        currentSortField = key;
                        currentSortDir = 'asc';
                    }
                    renderResults();
                    closeSortModal();
                };
                container.appendChild(btn);
            });
            
            // Add "Clear Sort" option
            if (currentSortField) {
                const clearBtn = document.createElement('button');
                clearBtn.className = 'sort-option-btn';
                clearBtn.style.color = '#ef4444';
                clearBtn.style.marginTop = '16px';
                clearBtn.style.borderTop = '1px solid rgba(255,255,255,0.1)';
                clearBtn.innerText = 'Clear Sort';
                clearBtn.onclick = () => {
                    currentSortField = null;
                    renderResults();
                    closeSortModal();
                };
                container.appendChild(clearBtn);
            }
            
            modal.style.display = 'block';
        }

        function closeSortModal() {
            document.getElementById('sortModal').style.display = 'none';
        }

        // Close modal if clicked outside
        window.onclick = function(event) {
            const modal = document.getElementById('sortModal');
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }

        // --- CSV EXPORT LOGIC ---
        function exportCSV() {
            if (currentFeatures.length === 0) {
                alert("No data available to export.");
                return;
            }

            // Extract all unique headers
            const headersSet = new Set();
            currentFeatures.forEach(f => {
                if(f.attributes) {
                    Object.keys(f.attributes).forEach(k => headersSet.add(k));
                }
            });
            const headers = Array.from(headersSet);

            // Construct CSV string
            let csvContent = "data:text/csv;charset=utf-8,";
            
            // Add headers row
            csvContent += headers.map(h => `"${h}"`).join(",") + "\r\n";
            
            // Sort features before export if a sort is active
            let exportFeatures = [...currentFeatures];
            if (currentSortField) {
                exportFeatures.sort((a, b) => {
                    let valA = a.attributes[currentSortField];
                    let valB = b.attributes[currentSortField];
                    if (valA === null || valA === undefined) return currentSortDir === 'asc' ? 1 : -1;
                    if (valB === null || valB === undefined) return currentSortDir === 'asc' ? -1 : 1;
                    if (typeof valA === 'string' && typeof valB === 'string') {
                        return currentSortDir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                    } else if (typeof valA === 'number' && typeof valB === 'number') {
                        return currentSortDir === 'asc' ? valA - valB : valB - valA;
                    }
                    return 0; 
                });
            }

            // Add data rows
            exportFeatures.forEach(f => {
                const attrs = f.attributes || {};
                const row = headers.map(header => {
                    let cellData = attrs[header];
                    if (cellData === null || cellData === undefined) {
                        cellData = "";
                    } else {
                        // Escape quotes and wrap in quotes for robust CSV parsing
                        cellData = String(cellData).replace(/"/g, '""');
                    }
                    return `"${cellData}"`;
                });
                csvContent += row.join(",") + "\r\n";
            });

            // Trigger download via hidden link
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            
            // Generate filename based on current target if available
            const scopeVal = document.getElementById('searchScopeValue').value || 'export';
            link.setAttribute("download", `arcgis_${scopeVal}_results.csv`);
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
